name: bestpay
description: "BESTpay v2 - 店舗と金額から保有カードの還元額ランキングを出す個人利用アプリ。"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # カタログJSON（第1期）。空カタログでも正常に起動する。
  # 実データは docs/decisions/card_addition_runbook.md の手順で追記する。
  assets:
    - assets/data/
    - assets/images/merchants/
    - assets/images/cards/
    # カード・店舗のロゴ画像。ファイルを追加するだけで反映される
    # （pubspec の変更は不要）。詳細は docs/decisions/image_assets.md
    - assets/images/cards/
    - assets/images/merchants/
