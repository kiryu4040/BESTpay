name: bestpay
description: "BESTpay v2 - 店舗と金額から保有カードの還元額ランキングを出す個人利用アプリ。"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 注意: assets の宣言はまだ書かないこと。
  # カタログ実データ（assets/data/）は次フェーズで用意する。
  # 存在しないディレクトリを宣言すると flutter build が失敗する。
