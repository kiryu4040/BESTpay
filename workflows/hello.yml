name: Hello World (動作確認用)

# このワークフローが Actions タブに現れて緑チェックになれば、
# .github/workflows/ が正しくアップロードされ、Actions が有効になっていることが確認できます。
# (本番APKビルドとは別の最軽量ワークフロー、5秒で完了)

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: 🎉 Hello
        run: |
          echo "✅ GitHub Actions は正常に動作しています！"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "🚀 これで Build Android APK ワークフローも動くはずです"
