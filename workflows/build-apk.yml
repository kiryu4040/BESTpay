name: Build Android APK

# トリガー: あらゆるブランチへのpush、PR、手動実行、タグ push
on:
  push:
    branches: ['**']      # ★ すべてのブランチで動作
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:      # ★ Actions タブから手動実行可能

# APKアップロードのため明示的に書き込み権限を与える
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: ✅ Show versions
        run: |
          flutter --version
          java -version
          echo "Branch: ${{ github.ref }}"

      - name: 🔄 Regenerate Android scaffold (if missing)
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Regenerating Android project structure..."
            flutter create --org com.bestpay --project-name bestpay --platforms=android .
          else
            echo "Android scaffold already present."
          fi

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build release APK
        run: flutter build apk --release

      - name: 📋 Rename & show APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BestPay.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: ⬆️ Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BestPay-APK
          path: build/app/outputs/flutter-apk/BestPay.apk
          retention-days: 90

      - name: 🚀 Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/BestPay.apk
          name: BestPay ${{ github.ref_name }}
          body: |
            ## 📱 BestPay APK ${{ github.ref_name }}

            ### スマホでインストール
            1. 下の `BestPay.apk` をスマホブラウザでタップ
            2. ダウンロード後タップして「不明なアプリのインストール」を許可
            3. インストール完了！

            ### 動作要件
            - Android 8.0 (API 26) 以上
          draft: false
          prerelease: false
