name: Schema validation

on:
  pull_request:
    paths:
      - "schemas/**"
      - "tool/schema/**"
      - ".github/workflows/schema-validation.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "tool/schema/**"
      - ".github/workflows/schema-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate JSON Schema contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/schema/requirements.txt

      - name: Install schema validator dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement tool/schema/requirements.txt

      - name: Validate schema structure and custom constraints
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tool/schema/validate_schemas.py .

      - name: Run detailed positive and negative contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tool/schema/test_schema_contracts.py .
